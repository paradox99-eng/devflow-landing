<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta Tags -->
  <title>DevFlow — Microservices & Modern Cloud Deployment Platform</title>
  <meta name="title" content="DevFlow — Microservices & Modern Cloud Deployment Platform" />
  <meta name="description"
    content="Deploy backend microservices and full-stack MERN apps in seconds with DevFlow. Automated CI/CD, edge distribution, and built-in observability." />
  <meta name="author" content="DevFlow Inc." />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://devflow.live/" />

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://devflow.live/" />
  <meta property="og:site_name" content="DevFlow" />
  <meta property="og:title" content="DevFlow — Microservices & Modern Cloud Deployment Platform" />
  <meta property="og:description"
    content="Deploy backend microservices and full-stack MERN apps in seconds. Automated CI/CD, edge distribution, and built-in observability." />
  <meta property="og:image" content="https://devflow.live/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://devflow.live/" />
  <meta name="twitter:site" content="@devflow" />
  <meta name="twitter:title" content="DevFlow — Microservices & Modern Cloud Deployment Platform" />
  <meta name="twitter:description"
    content="Deploy backend microservices and full-stack MERN apps in seconds with DevFlow." />
  <meta name="twitter:image" content="https://devflow.live/twitter-card.png" />

  <!-- Theme & Mobile Colors -->
  <meta name="theme-color" content="#0b0f19" />

  <!-- Preconnect to Font Origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Asynchronously Load Google Fonts (Non-Render-Blocking) -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  </noscript>

  <!-- Schema.org Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://devflow.live/#organization",
        "name": "DevFlow",
        "url": "https://devflow.live/",
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "enterprise@devflow.live",
          "contactType": "sales",
          "availableLanguage": "English"
        }
      },
      {
        "@type": "SoftwareApplication",
        "name": "DevFlow Platform",
        "operatingSystem": "Cloud",
        "applicationCategory": "DeveloperApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Continuous delivery and runtime infrastructure for modern web applications."
      }
    ]
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
